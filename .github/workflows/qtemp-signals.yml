name: QTemp confirmed daily signals
on:
  schedule:
    # 07:30 Asia/Taipei, after US regular market close
    - cron: '30 23 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qtemp-daily-signals
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Evaluate confirmed QTemp signals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python qtemp_alerts.py
