name: QTemp validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app.py qtemp_core.py research_features.py capital_backtest.py research_insights.py market_cache.py qtemp_alerts.py test_capital_backtest.py test_research_insights.py test_market_cache.py qtemp_zones.py test_qtemp_zones.py deep_comparison.py test_deep_comparison.py
      - name: Check JavaScript
        run: |
          node --check research_features.js
          node --check capital_backtest_ui.js
          node --check research_insights_ui.js
          node --check platform_navigation.js
          node --check workspace_dashboard.js
          node --check workspace_watchlist.js
          node --check qtemp_zones_ui.js
          node --check deep_comparison_ui.js
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const script=html.match(/<script>\s*([\s\S]*?)<\/script>/);
          if(!script)throw Error('Inline QTemp JS not found');
          new Function(script[1]);
          JS
      - name: Capital backtest deterministic tests
        run: python -m unittest -v test_capital_backtest test_research_insights test_market_cache test_qtemp_zones test_deep_comparison
      - name: Flask and input smoke test
        run: |
          python - <<'PY'
          from app import app
          from research_features import symbols
          assert symbols('AAPL,SPY',4)==['AAPL','SPY']
          assert app.test_client().get('/health').json['status']=='ok'
          assert app.test_client().get('/research_features.js').status_code==200
          assert app.test_client().get('/research_features.css').status_code==200
          assert app.test_client().get('/capital_backtest_ui.js').status_code==200
          assert app.test_client().get('/capital_backtest.css').status_code==200
          assert app.test_client().get('/research_insights_ui.js').status_code==200
          assert app.test_client().get('/research_insights.css').status_code==200
          assert app.test_client().get('/workspace_dashboard.js').status_code==200
          assert app.test_client().get('/workspace_watchlist.js').status_code==200
          assert app.test_client().get('/workspace_glass.css').status_code==200
          assert app.test_client().get('/qtemp_zones_ui.js').status_code==200
          assert app.test_client().get('/qtemp_zones.css').status_code==200
          assert app.test_client().get('/deep_comparison_ui.js').status_code==200
          assert app.test_client().get('/deep_comparison.css').status_code==200
          diag=app.test_client().get('/api/diagnostics')
          assert diag.status_code==200
          assert 'uptimeSeconds' in diag.json and 'errors' in diag.json
          for route in ('scan','strategy','compare_assets','capital_comparison','research','zones','deep_compare'):
              assert app.test_client().post('/api/'+route,json={'args':[]}).status_code==400
          print('All smoke checks passed')
          PY
